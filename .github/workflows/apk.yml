name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar la app web
        run: |
          mkdir www
          cp -r index.html app.js arcanos.js styles.css sw.js manifest.webmanifest icons fonts www/

      - name: Instalar Capacitor
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Icono propio (si falla, queda el de por defecto)
        continue-on-error: true
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            convert icons/icon-512.png -resize ${2}x${2} $RES/mipmap-$1/ic_launcher.png
            cp $RES/mipmap-$1/ic_launcher.png $RES/mipmap-$1/ic_launcher_round.png
          done

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: estrella-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
